name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@c541c155eee95eac327059db6fe2353fe1e1cf96 # v2.32.0
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Dependencies
        uses: ramsey/composer-install@57532f4beed50d268d86e1054e605f4e64364024 # v3.0.0

      - name: Run Security Audit (Composer Audit)
        run: composer audit

  style:
    name: Check Code Style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@c541c155eee95eac327059db6fe2353fe1e1cf96 # v2.32.0
        with:
          php-version: '8.5'
          extensions: dom, mbstring, zip, libxml, json, tokenizer, fileinfo
          coverage: none

      - name: Install Dependencies
        uses: ramsey/composer-install@57532f4beed50d268d86e1054e605f4e64364024 # v3.0.0

      - name: Check Code Style (Pint)
        run: ./vendor/bin/pint --test

  analyze:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@c541c155eee95eac327059db6fe2353fe1e1cf96 # v2.32.0
        with:
          php-version: '8.5'
          extensions: dom, mbstring, zip, libxml, json, tokenizer, fileinfo
          coverage: none

      - name: Install Dependencies
        uses: ramsey/composer-install@57532f4beed50d268d86e1054e605f4e64364024 # v3.0.0

      - name: Run Static Analysis (PHPStan)
        run: ./vendor/bin/phpstan analyse --no-progress

  test:
    name: PHP ${{ matrix.php }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@c541c155eee95eac327059db6fe2353fe1e1cf96 # v2.32.0
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, zip, libxml, json, tokenizer, fileinfo
          coverage: ${{ matrix.os == 'ubuntu-latest' && matrix.php == '8.4' && 'pcov' || 'none' }}

      - name: Install Dependencies
        uses: ramsey/composer-install@57532f4beed50d268d86e1054e605f4e64364024 # v3.0.0
        with:
          dependency-versions: ${{ matrix.php == '8.2' && 'lowest' || 'highest' }}

      - name: Warm Up TypePHP Cache
        run: php bin/typephp cache:warm

      - name: Run Full Test Suite with Coverage (Pest)
        run: ./vendor/bin/pest --coverage-clover=clover.xml --compact
        if: matrix.os == 'ubuntu-latest' && matrix.php == '8.4'

      - name: Run Full Test Suite (Pest)
        run: ./vendor/bin/pest --compact
        if: "! (matrix.os == 'ubuntu-latest' && matrix.php == '8.4')"

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@7f8b3261c2b5d74961760728368266191b90a2d3 # v5.3.1
        if: matrix.os == 'ubuntu-latest' && matrix.php == '8.4'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: clover.xml
          fail_ci_if_error: false